services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: beleza
      MYSQL_USER: beleza
      MYSQL_PASSWORD: beleza_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
