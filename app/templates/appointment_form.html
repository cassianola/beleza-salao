{% extends 'base.html' %}{% block title %}{{'Editar' if item else 'Novo'}} Agendamento{% endblock %}{% block content %}<h1>▦ &nbsp;{{'Editar' if item else 'Novo'}} Agendamento</h1><p class="subtitle">Preencha os dados abaixo para agendar um atendimento.</p><form method="post" id="appointment-form" data-slots="{{url_for('main.slots')}}" data-exclude="{{item.id if item else ''}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="form-grid"><section class="panel form-panel"><label for="client_id">♙ Cliente <b>*</b></label><select id="client_id" name="client_id" required><option value="">Selecione um cliente</option>{% for c in clients %}<option value="{{c.id}}" {{'selected' if values.client_id|string==c.id|string else ''}}>{{c.name}}</option>{% endfor %}</select><label for="service_id">✂ Serviço <b>*</b></label><select id="service_id" name="service_id" required><option value="">Selecione um serviço</option>{% for s in services %}<option value="{{s.id}}" data-duration="{{s.duration}}" {{'selected' if values.service_id|string==s.id|string else ''}}>{{s.name}}</option>{% endfor %}</select><label for="duration">◷ Duração</label><input id="duration" readonly placeholder="Selecione o serviço"><label for="notes">▤ Observações (opcional)</label><textarea id="notes" name="notes" rows="4" maxlength="1000" placeholder="Ex.: preferência de profissional, etc.">{{values.notes or ''}}</textarea></section><section class="panel form-panel"><label for="date">▦ Selecione a data <b>*</b></label><input id="date" name="date" type="date" value="{{values.date}}" min="{{today}}" required><div id="calendar" class="calendar" aria-label="Calendário"></div></section><section class="panel form-panel"><label for="start">◷ Selecione o horário <b>*</b></label><input type="time" id="start" name="start" value="{{values.start}}" required><div id="slots" class="slots" aria-live="polite"><p class="muted">Selecione serviço e data.</p></div></section></div><div class="form-footer"><a class="secondary" href="{{url_for('main.appointments')}}">← Voltar</a><div><a class="secondary" href="{{url_for('main.appointments')}}">Cancelar</a><button type="submit" class="primary">▦ Salvar Agendamento</button></div></div></form>{% endblock %}
