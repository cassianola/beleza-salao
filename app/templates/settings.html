{% extends 'base.html' %}{% block content %}<h1>⚙ &nbsp;Configurações</h1><p class="subtitle">Gerencie o expediente e os serviços do salão.</p><div class="split"><section class="panel form-panel"><h2>Horário de funcionamento</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input type="hidden" name="action" value="hours"><label for="opening">Abertura</label><input id="opening" type="time" name="opening" value="{{settings.opening.strftime('%H:%M') if settings else '09:00'}}" required><label for="closing">Fechamento</label><input id="closing" type="time" name="closing" value="{{settings.closing.strftime('%H:%M') if settings else '18:00'}}" required><button class="primary full">Salvar expediente</button></form></section><section class="panel form-panel"><h2>Serviços</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input type="hidden" name="action" value="service"><label for="name">Nome do serviço</label><input id="name" name="name" required maxlength="120"><label for="duration">Duração (minutos)</label><input id="duration" name="duration" type="number" min="5" max="720" required><button class="primary full">Adicionar serviço</button></form><table><thead><tr><th>Serviço</th><th>Duração</th></tr></thead><tbody>{% for s in services %}<tr><td>{{s.name}}</td><td>{{s.duration}} min</td></tr>{% endfor %}</tbody></table></section></div>{% endblock %}
